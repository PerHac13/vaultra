app:
  log_level: info
  name: PostgreSQL Backup

database:
  type: postgres
  config:
    host: localhost
    port: 5432
    user: postgres
    password: postgrespassword
    database: student_portal_new
    ssl_mode: disable
    connection_timeout_secs: 30

storage:
  type: local
  config:
    base_path: /backups/postgres

compression:
  algorithm: gzip
  level: 6

backup:
  retention_days: 30
  full_backup:
    enabled: true
